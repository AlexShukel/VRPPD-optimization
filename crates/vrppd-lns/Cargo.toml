[package]
name = "vrppd-lns"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Large Neighbourhood Search for the VRPPD with pluggable (classical and neural) destroy operators, label generation for supervised training, and experiment CLIs."

[[bin]]
name = "lns"
path = "src/bin/lns.rs"

[[bin]]
name = "label"
path = "src/bin/label.rs"

[[bin]]
name = "gen_instances"
path = "src/bin/gen_instances.rs"

[[bin]]
name = "cea_ref"
path = "src/bin/cea_ref.rs"

[dependencies]
vrppd-core = { workspace = true }
vrppd-cea = { workspace = true }
rand = { workspace = true }
rand_xoshiro = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
