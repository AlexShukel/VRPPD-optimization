[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/AlexShukel/VRPPD-optimization"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vrppd-core = { path = "crates/vrppd-core" }
vrppd-brute-force = { path = "crates/vrppd-brute-force" }
vrppd-milp = { path = "crates/vrppd-milp" }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
