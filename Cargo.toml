[workspace]
resolver = "3"
members = ["crates/*"]
# vrppd-py is a Python extension module built with maturin; plain `cargo`
# commands leave it out so they do not need Python.
default-members = [
  "crates/vrppd-benchmarks",
  "crates/vrppd-brute-force",
  "crates/vrppd-cea",
  "crates/vrppd-core",
  "crates/vrppd-lns",
  "crates/vrppd-milp",
  "crates/vrppd-or-tools",
  "crates/vrppd-psa",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/AlexShukel/VRPPD-optimization"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_xoshiro = "0.6"
crossbeam-channel = "0.5"
vrppd-core = { path = "crates/vrppd-core" }
vrppd-brute-force = { path = "crates/vrppd-brute-force" }
vrppd-milp = { path = "crates/vrppd-milp" }
vrppd-or-tools = { path = "crates/vrppd-or-tools" }
vrppd-psa = { path = "crates/vrppd-psa" }
vrppd-cea = { path = "crates/vrppd-cea" }
vrppd-lns = { path = "crates/vrppd-lns" }
rayon = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
