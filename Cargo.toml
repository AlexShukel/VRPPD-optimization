[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/AlexShukel/VRPPD-optimization"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_xoshiro = "0.6"
crossbeam-channel = "0.5"
vrppd-core = { path = "crates/vrppd-core" }
vrppd-brute-force = { path = "crates/vrppd-brute-force" }
vrppd-milp = { path = "crates/vrppd-milp" }
vrppd-or-tools = { path = "crates/vrppd-or-tools" }
vrppd-psa = { path = "crates/vrppd-psa" }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
